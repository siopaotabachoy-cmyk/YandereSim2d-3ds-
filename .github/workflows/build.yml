name: Build CIA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get template Makefile and enable citro2d
        run: |
          git clone --depth 1 https://github.com/devkitPro/3ds-examples /tmp/ex
          cp /tmp/ex/templates/application/Makefile Makefile
          sed -i 's/^LIBS[[:space:]]*:=.*/LIBS := -lcitro2d -lcitro3d -lctru -lm/' Makefile

      - name: Build .elf/.3dsx/.smdh with devkitARM
        run: |
          docker run --rm -v "$PWD":/work -w /work devkitpro/devkitarm \
            make TARGET=yandereschool

      - name: Download makerom and bannertool
        run: |
          gh release download -R 3DSGuy/Project_CTR -p '*ubuntu_x86_64*'
          unzip -o '*ubuntu_x86_64*.zip'
          chmod +x makerom
          TAG=$(gh release list -R Steveice10/bannertool --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R Steveice10/bannertool -p 'bannertool.zip'
            unzip -o bannertool.zip
          else
            git clone --recursive https://github.com/Steveice10/bannertool /tmp/bannertool
            make -C /tmp/bannertool
            mkdir -p linux-x86_64
            cp /tmp/bannertool/output/linux-x86_64/bannertool linux-x86_64/bannertool
          fi
          chmod +x linux-x86_64/bannertool

      - name: Make placeholder banner assets
        run: |
          convert -size 256x128 xc:'#d63384' banner.png
          python3 - <<'EOF'
          import wave
          w = wave.open('silent.wav', 'wb')
          w.setnchannels(2); w.setsampwidth(2); w.setframerate(22050)
          w.writeframes(b'\x00' * 22050 * 4 * 3)
          w.close()
          EOF
          ./linux-x86_64/bannertool makebanner -i banner.png -a silent.wav -o banner.bnr

      - name: Build .cia
        run: |
          ./makerom -f cia -o yandereschool.cia -elf yandereschool.elf \
            -rsf app.rsf -target t -exefslogo \
            -icon yandereschool.smdh -banner banner.bnr

      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: |
            yandereschool.cia
            yandereschool.3dsx
